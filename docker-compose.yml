version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: awty
      POSTGRES_PASSWORD: awty_secret
      POSTGRES_DB: awty

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awty -d awty"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    image: awty-backend:latest

    command:
      [
        "sh",
        "-c",
        "npx typeorm migration:run -d ./dist/database/data-source.js",
      ]

    environment:
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: awty
      DB_PASSWORD: awty_secret
      DB_NAME: awty

      DB_POOL_MAX: 20
      DB_POOL_MIN: 2
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONNECTION_TIMEOUT: 5000

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    image: awty-backend:latest

    command: ["node", "--enable-source-maps", "dist/main"]

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: awty
      DB_PASSWORD: awty_secret
      DB_NAME: awty

      DB_POOL_MAX: 20
      DB_POOL_MIN: 2
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONNECTION_TIMEOUT: 5000

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrator:
        condition: service_completed_successfully

  worker:
    image: awty-backend:latest

    command: ["node", "--enable-source-maps", "dist/workers/worker-main"]

    restart: unless-stopped

    environment:
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: awty
      DB_PASSWORD: awty_secret
      DB_NAME: awty

      DB_POOL_MAX: 20
      DB_POOL_MIN: 2
      DB_POOL_IDLE_TIMEOUT: 30000
      DB_POOL_CONNECTION_TIMEOUT: 5000

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrator:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
